<body>

    <h1>Payroll AI Assistant</h1>
    <p>Employee Payroll & Tax Assistant</p>

    <hr>

    <h3>Upload Payslip</h3>

    <input type="file" id="payslip">
    <button id="uploadBtn">Upload</button>

    <hr>

    <h3>Ask Payroll Question</h3>

    <textarea
        id="question"
        rows="4"
        placeholder="Example: Why is my net salary lower this month?">
    </textarea>

    <br><br>

    <button id="askBtn">Ask AI</button>

    <h4>AI Response</h4>

    <div id="response">
        Waiting for your question...
    </div>

    <hr>

    <h3>Tax Saving Simulation</h3>

    <input
        type="number"
        id="investment"
        placeholder="80C Investment Amount">

    <button id="taxBtn">
        Calculate
    </button>

    <h4>Estimated Tax Saving</h4>

    <div id="taxResult">
        --
    </div>

    <hr>

    <h3>Investment Proof Checklist</h3>

    <ul>
        <li>✅ HRA Rent Receipts</li>
        <li>❌ Section 80C Investment Proof</li>
        <li>❌ LTA Bills</li>
    </ul>

    <script src="app.js"></script>

</body>
